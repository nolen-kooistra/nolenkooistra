<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit 1 | Nolen Kooistra</title>
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #222;
      background: #f7f7f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      padding: 4rem 1.5rem;
      color: #fff;
      text-align: center;
      background: #c8102e;
    }

    header h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.25rem, 6vw, 4rem);
    }

    header p {
      margin: 0;
      font-size: 1.25rem;
    }

    nav {
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    nav ul {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 0;
      padding: 1rem;
      list-style: none;
    }

    nav a {
      color: #c8102e;
      font-weight: 700;
      text-decoration: none;
    }

    nav a:hover,
    nav a:focus {
      text-decoration: underline;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    section {
      margin-top: 3rem;
      text-align: left;
    }

    section h2 {
      color: #c8102e;
      text-align: center;
    }

    .carousel {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .carousel-viewport {
      overflow: hidden;
      min-height: 420px;
      padding: 1rem;
      border: 1px solid #ddd;
      background: #fff;
      text-align: center;
    }

    .page-preview {
      display: none;
      width: 100%;
      cursor: zoom-in;
    }

    .page-preview.active {
      display: block;
    }

    .page-preview canvas {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
      box-shadow: 0 2px 8px rgb(0 0 0 / 15%);
    }

    .carousel-button {
      width: 2.5rem;
      height: 2.5rem;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: #c8102e;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .carousel-button:hover,
    .carousel-button:focus {
      background: #9f0d25;
    }

    .carousel-status {
      margin: 0;
      color: #555;
      text-align: center;
      font-size: 0.95rem;
    }

    .paragraph-space {
      min-height: 8rem;
      margin-bottom: 1.5rem;
      padding: 1rem;
      border: 1px solid #ddd;
      background: #fff;
    }

    dialog {
      width: min(95vw, 1100px);
      max-width: 1100px;
      padding: 1rem;
      border: 0;
      background: rgb(255 255 255 / 98%);
      box-shadow: 0 8px 30px rgb(0 0 0 / 35%);
    }

    dialog::backdrop {
      background: rgb(0 0 0 / 75%);
    }

    .modal-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .close-modal {
      display: block;
      margin: 0 0 0.75rem auto;
      padding: 0.5rem 0.8rem;
      border: 0;
      color: #fff;
      background: #c8102e;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .carousel {
        gap: 0.5rem;
      }

      .carousel-viewport {
        min-height: 300px;
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Unit 1 Lens-Based Analysis Essay</h1>
    <p>Writing Process Archive</p>
  </header>

  <nav aria-label="Main navigation">
    <ul>
      <li><a href="index.hmtl">About</a></li>
      <li><a href="unit1.html" aria-current="page">Unit 1</a></li>
    </ul>
  </nav>

  <main id="unit-1">
    <h2>Unit 1 Lens-Based Analysis Essay</h2>

    <section aria-labelledby="blog-title">
      <h2 id="blog-title">Blog: High of Cellphones in Teens</h2>

      <div class="carousel" aria-label="Project 1 Pre-Writing pages">
        <button class="carousel-button" type="button" id="previous-page" aria-label="Previous page">&#8249;</button>
        <div class="carousel-viewport" id="carousel-viewport">
          <p id="loading-message">Loading PDF pages&hellip;</p>
        </div>
        <button class="carousel-button" type="button" id="next-page" aria-label="Next page">&#8250;</button>
      </div>
      <p class="carousel-status" id="carousel-status" aria-live="polite"></p>

      <div class="paragraph-space">&nbsp;</div>
      <div class="paragraph-space">&nbsp;</div>
      <div class="paragraph-space">&nbsp;</div>
    </section>
  </main>

  <dialog id="image-dialog" aria-label="Enlarged PDF page">
    <button class="close-modal" type="button" id="close-modal">Close</button>
    <canvas class="modal-image" id="modal-image"></canvas>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module">
  </script>
  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    const pdfUrl = 'Project%201%20Pre-Writing%20%20(1).pdf';
    const viewport = document.querySelector('#carousel-viewport');
    const status = document.querySelector('#carousel-status');
    const dialog = document.querySelector('#image-dialog');
    const modalCanvas = document.querySelector('#modal-image');
    const pages = [];
    let currentPage = 0;

    function showPage(index) {
      currentPage = (index + pages.length) % pages.length;
      pages.forEach((page, pageIndex) => {
        page.classList.toggle('active', pageIndex === currentPage);
      });
      status.textContent = `Page ${currentPage + 1} of ${pages.length}. Click the page to enlarge it.`;
    }

    function enlargePage(pageCanvas) {
      const scale = Math.min(2, window.innerWidth / pageCanvas.width * 1.5);
      modalCanvas.width = pageCanvas.width * scale;
      modalCanvas.height = pageCanvas.height * scale;
      modalCanvas.getContext('2d').drawImage(pageCanvas, 0, 0, modalCanvas.width, modalCanvas.height);
      dialog.showModal();
    }

    document.querySelector('#previous-page').addEventListener('click', () => showPage(currentPage - 1));
    document.querySelector('#next-page').addEventListener('click', () => showPage(currentPage + 1));
    document.querySelector('#close-modal').addEventListener('click', () => dialog.close());

    try {
      const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber += 1) {
        const page = await pdf.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });
        const scale = Math.min(1.5, 760 / baseViewport.width);
        const pageViewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = pageViewport.width;
        canvas.height = pageViewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: pageViewport }).promise;

        const preview = document.createElement('button');
        preview.type = 'button';
        preview.className = 'page-preview';
        preview.setAttribute('aria-label', `Enlarge page ${pageNumber}`);
        preview.appendChild(canvas);
        preview.addEventListener('click', () => enlargePage(canvas));
        viewport.appendChild(preview);
        pages.push(preview);
      }

      document.querySelector('#loading-message').remove();
      showPage(0);
    } catch (error) {
      document.querySelector('#loading-message').textContent =
        'The PDF preview could not be loaded. Open the PDF directly to view it.';
      status.textContent = error.message;
    }
  </script>
</body>
</html>
